name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet run --project tests/AltSnapLite.Tests -c Release
      - name: Build
        run: ./build.ps1
      - name: Smoke test of the published EXE
        timeout-minutes: 2
        run: |
          $process = Start-Process dist/AltSnapLite.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }
      - name: Check version matches tag
        run: |
          $version = (Get-Item dist/AltSnapLite.exe).VersionInfo.ProductVersion.Split('+')[0]
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match app version $version" }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid tag" }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $heading = [array]::IndexOf($lines, "## $version")
          if ($heading -lt 0) { throw "CHANGELOG.md has no section '## $version'" }
          $notes = @()
          foreach ($line in $lines[($heading + 1)..($lines.Length - 1)]) {
            if ($line -match '^## ') { break }
            $notes += $line
          }
          if (-not ($notes -join '').Trim()) { throw "CHANGELOG.md section '## $version' is empty" }
          $notes | Set-Content notes.md
          gh release create $env:GITHUB_REF_NAME dist/AltSnapLite.exe --title "AltSnap Lite $version" --notes-file notes.md
